openapi: 3.0.3
info:
  title: CRM System API
  description: API для системы управления CRM Ремонтти
  version: 1.0.0
  contact:
    name: API Support
    email: support@remontti.com

servers:
  - url: /api
    description: API server

tags:
  - name: Auth
    description: Операции аутентификации
  - name: Translations
    description: Операции с переводами
  - name: Navigation
    description: Операции навигации
  - name: Users
    description: Управление пользователями
  - name: Company
    description: Операции компании (филиалы и т.д.)

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Войти в систему
      description: Аутентификация пользователя по логину и паролю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Выйти из системы
      description: Завершение сессии пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный выход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'

  /translations/{page}:
    get:
      tags:
        - Translations
      summary: Получить переводы для страницы
      description: Возвращает все переводы для указанной страницы
      parameters:
        - name: page
          in: path
          required: true
          description: Название страницы (например, login, dashboard)
          schema:
            type: string
      responses:
        '200':
          description: Успешное получение переводов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationResponse'
        '404':
          description: Страница не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /navigation/get:
    get:
      tags:
        - Navigation
      summary: Получить меню навигации
      description: Возвращает список пунктов меню для текущего пользователя на основе его роли и прав доступа
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешное получение навигации
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NavItem'
        '401':
          description: Неавторизованный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users:
    get:
      tags:
        - Users
      summary: Получить список пользователей
      description: Возвращает всех пользователей системы
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешное получение списка пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Неавторизованный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Users
      summary: Создать пользователя
      description: Создаёт нового пользователя
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Пользователь с таким login уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    put:
      tags:
        - Users
      summary: Обновить пользователя
      description: Обновляет данные существующего пользователя
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Пользователь обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Users
      summary: Удалить пользователя
      description: Удаляет пользователя по ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Пользователь удалён
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /company/branches/get:
    get:
      tags:
        - Company
      summary: Получить список филиалов
      description: Возвращает список всех филиалов компании
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешное получение списка филиалов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBranchesResponse'
        '401':
          description: Неавторизованный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          description: Логин пользователя (формат: строка.строка)
          example: t.test
        password:
          type: string
          description: Пароль пользователя
          example: password

    LoginResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/User'
        error:
          type: string
          example: Invalid login or password

    LogoutResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true

    User:
      type: object
      required:
        - login
        - email
        - name
        - role
      properties:
        id:
          type: integer
          example: 1
        login:
          type: string
          example: t.test
        email:
          type: string
          format: email
          example: t.test@company.com
        name:
          type: string
          example: Test User
        role:
          type: string
          enum: [admin, user, manager, employee]
          example: admin
        startPage:
          type: string
          description: Стартовая страница пользователя
          example: /dashboard
        avatarUrl:
          type: string
          description: URL аватара пользователя
          example: /avatars/user1.png
        host:
          type: string
          description: Поддомен, к которому привязан пользователь
          example: work

    TranslationResponse:
      type: object
      additionalProperties:
        type: string
      example:
        login.title: CRM System
        login.subtitle: Enter your credentials
        login.sign_in: Sign In

    NavItem:
      type: object
      required:
        - id
        - name
        - link
        - iconUrl
      properties:
        id:
          type: integer
          description: Уникальный идентификатор пункта меню
          example: 1
        name:
          type: string
          description: Название пункта меню
          example: Dashboard
        link:
          type: string
          description: Ссылка для перехода
          example: /dashboard
        iconUrl:
          type: string
          description: URL иконки для пункта меню
          example: /icons/dashboard.svg

    Branch:
      type: object
      required:
        - id
        - name
        - code
        - isActive
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Main Branch
        code:
          type: string
          example: MAIN
        address:
          type: string
          example: 123 Main St
        isActive:
          type: boolean
          example: true

    GetBranchesResponse:
      type: object
      required:
        - success
        - branches
      properties:
        success:
          type: boolean
          example: true
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'

    CreateUserRequest:
      type: object
      required:
        - login
        - email
        - name
        - role
      properties:
        login:
          type: string
          example: john.doe
        email:
          type: string
          format: email
          example: john@company.com
        name:
          type: string
          example: John Doe
        role:
          type: string
          enum: [admin, user, manager, employee]
          example: user
        startPage:
          type: string
          example: /dashboard
        avatarUrl:
          type: string
          example: /avatars/john.png

    UpdateUserRequest:
      type: object
      properties:
        login:
          type: string
          example: john.doe
        email:
          type: string
          format: email
          example: john@company.com
        name:
          type: string
          example: John Doe
        role:
          type: string
          enum: [admin, user, manager, employee]
          example: manager
        startPage:
          type: string
          example: /dashboard
        avatarUrl:
          type: string
          example: /avatars/john.png
        host:
          type: string
          example: work

    Error:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          example: 401
        message:
          type: string
          example: Invalid login or password
        code:
          type: string
          example: AUTH_FAILED

    ValidationError:
      type: object
      required:
        - status
        - errors
      properties:
        status:
          type: integer
          example: 422
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: login
              message:
                type: string
                example: Field is required

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
